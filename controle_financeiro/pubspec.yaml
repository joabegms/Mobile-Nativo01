name: controle_financeiro
description: "Aplicativo avançado de controle financeiro pessoal com Flutter, SQLite, Firebase, Gráficos, Notícias e Material Design 3."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  path_provider: ^2.1.5
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  
  # API e HTTP
  http: ^1.1.0
  url_launcher: ^6.2.0
  
  # Gráficos
  fl_chart: ^0.64.0
  
  # Formatação e Utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
